# Configuration of Hugo
# Guide: https://docs.hugoblox.com/tutorial/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Website name (set in params.yaml under hugoblox.branding.name)
title: ''
baseURL: 'https://afallo2.com/'

############################
## PAGE OPTIONS
############################

cascade:
  # 文章、市場動態、週報、掃描：單篇頁面設定
  - target:
      path: '{/blog/**,/news/**,/reports/**}'
      kind: page
    pager: true
    editable: false
    show_date: true
    show_date_updated: false
    reading_time: true
    commentable: false
    show_related: true
    share: true
    show_breadcrumb: true
    header:
      navbar:
        enable: true
  # 各區塊列表頁
  - target:
      path: '{/blog,/news,/reports/**}'
      kind: section
    view: date-title-summary


############################
## LANGUAGE
############################

defaultContentLanguage: zh-hant
hasCJKLanguage: true
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## ADVANCED
############################

build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
disableAliases: true
outputs:
  home: [HTML, RSS, headers, redirects]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart
  hint: picture
timeout: 600000
taxonomies:
  tag: tags
  category: categories
  author: authors
markup:
  _merge: deep
  highlight:
    lineNos: false
security:
  _merge: deep
sitemap:
  _merge: deep
